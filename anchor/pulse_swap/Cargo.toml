# Reference Cargo.toml for the pulse_swap Anchor program.
#
# You do NOT build this locally (this machine has no Rust/Anchor toolchain).
# Solana Playground (beta.solpg.io) manages its own Cargo.toml. anchor-spl is a
# crate Playground supports out of the box, so `use anchor_spl::...` should just
# resolve. The program uses NO special anchor-lang cargo feature (no
# init-if-needed), so there is nothing extra to enable. See docs/SWAP_DEPLOY.md.
#
# Pin anchor-lang and anchor-spl to the SAME version Playground uses (currently
# ~0.30.1). If Playground shows a different version, match both lines to it.

[package]
name = "pulse_swap"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "lib"]
name = "pulse_swap"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.30.1"
anchor-spl = "0.30.1"
